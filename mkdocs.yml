site_name: Tai Chi Knowledge Base
site_description: Comprehensive Tai Chi training resource - Foundation, Advanced, and Elite levels
site_author: Henry Pham
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  palette:
    primary: teal
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.highlight
    - search.suggest
  language: en

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - footnotes

plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav_translations:
            Home: Home
            Foundation: Foundation
            Overview: Overview
            Basics: Basics
            'Deep Dives': Deep Dives
            Advanced: Advanced
            Elite: Elite
            Taichi: Taichi
        - locale: vi
          name: Tiếng Việt
          build: true
          nav_translations:
            Home: Trang Chủ
            Foundation: Nền Tảng
            Overview: Tổng Quan
            Basics: Cơ Bản
            'Deep Dives': Chuyên Sâu
            Advanced: Cao Cấp
            Elite: Tinh Hoa
            Taichi: Thái Cực
      fallback_to_default: true

nav:
  - Home: index.md
  - Taichi: taichi/index.md
  - Foundation:
      - Overview: foundation/index.md
      - Basics: foundation/basics/index.md
      - Deep Dives: foundation/deep-dives/index.md
  - Advanced:
      - Overview: advanced/index.md
      - Basics: advanced/basics/index.md
      - Deep Dives: advanced/deep-dives/index.md
  - Elite:
      - Overview: elite/index.md
      - Basics: elite/basics/index.md
      - Deep Dives: elite/deep-dives/index.md
