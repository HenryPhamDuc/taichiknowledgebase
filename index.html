<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=en/index.html">
  <title>Tai Chi Knowledge Base — Redirect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 { color: #333; margin-bottom: 16px; font-size: 28px; }
    p { color: #666; margin-bottom: 24px; line-height: 1.6; }
    .lang-links { display: flex; gap: 16px; justify-content: center; margin-top: 24px; }
    .lang-link {
      display: inline-block; padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; text-decoration: none; border-radius: 8px; font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .lang-link:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
    .loading { margin-top: 20px; color: #999; font-size: 14px; }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid #f3f3f3; border-top: 3px solid #667eea;
      border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧘 Tai Chi Knowledge Base</h1>
    <p>Welcome to the comprehensive Tai Chi training resource, structured across three skill levels: <strong>Foundation</strong>, <strong>Advanced</strong>, and <strong>Elite</strong>.</p>
    <p>Choose your language to begin:</p>
    <div class="lang-links">
      <a href="en/index.html" class="lang-link">English</a>
      <a href="vi/index.html" class="lang-link">Tiếng Việt</a>
    </div>
    <p class="loading"><span class="spinner"></span> Redirecting to English version...</p>
  </div>
  <script>setTimeout(function() { window.location.href = 'en/index.html'; }, 2000);</script>
</body>
</html>
